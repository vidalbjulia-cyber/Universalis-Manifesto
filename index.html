<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Quiz de Arquétipos</title>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Segoe UI', sans-serif;
      background: linear-gradient(180deg, #0b0613, #140d20, #1b1028);
      color: #f5e9dc;
      min-height: 100vh;
      padding: 40px 20px;
      display: flex;
      justify-content: center;
    }

    .container {
      width: 100%;
      max-width: 850px;
      background: rgba(255,255,255,0.04);
      border: 1px solid rgba(255,255,255,0.08);
      backdrop-filter: blur(12px);
      border-radius: 28px;
      padding: 40px;
      box-shadow: 0 0 30px rgba(0,0,0,0.4);
    }

    h1 {
      font-size: 42px;
      text-align: center;
      margin-bottom: 15px;
      color: #f7d7b8;
    }

    .sub {
      text-align: center;
      color: #d9c5b3;
      margin-bottom: 35px;
      line-height: 1.6;
    }

    .question {
      margin-bottom: 35px;
      padding: 25px;
      background: rgba(255,255,255,0.03);
      border-radius: 20px;
      border: 1px solid rgba(255,255,255,0.05);
    }

    .question h2 {
      font-size: 22px;
      margin-bottom: 20px;
      color: #ffe2c8;
    }

    .options {
      display: grid;
      gap: 12px;
    }

    .option {
      background: linear-gradient(90deg, #2b1838, #1f132c);
      border: 1px solid rgba(255,255,255,0.08);
      padding: 14px 18px;
      border-radius: 14px;
      cursor: pointer;
      transition: 0.3s;
    }

    .option:hover {
      transform: scale(1.02);
      border-color: #d7a86e;
      background: linear-gradient(90deg, #3a1f4d, #261636);
    }

    .option.selected {
      background: linear-gradient(90deg, #6a356e, #3d2357);
      border-color: #ffca8d;
    }

    button {
      width: 100%;
      margin-top: 20px;
      padding: 18px;
      border: none;
      border-radius: 18px;
      background: linear-gradient(90deg, #e7a86c, #b06cff);
      color: white;
      font-size: 18px;
      cursor: pointer;
      transition: 0.3s;
      font-weight: bold;
    }

    button:hover {
      transform: scale(1.02);
      opacity: 0.95;
    }

    #resultado {
      margin-top: 40px;
      display: none;
      padding: 35px;
      border-radius: 24px;
      background: rgba(255,255,255,0.05);
      text-align: center;
      border: 1px solid rgba(255,255,255,0.08);
    }

    #resultado h2 {
      font-size: 38px;
      margin-bottom: 12px;
      color: #ffd8a9;
    }

    #resultado p {
      line-height: 1.8;
      color: #eadfd2;
      font-size: 18px;
    }

    .spotify {
      display: inline-block;
      margin-top: 24px;
      text-decoration: none;
      padding: 14px 26px;
      border-radius: 14px;
      background: linear-gradient(90deg, #d98cff, #f5b36c);
      color: white;
      font-weight: bold;
    }

    @media(max-width: 700px){
      .container {
        padding: 25px;
      }

      h1 {
        font-size: 32px;
      }

      .question h2 {
        font-size: 19px;
      }
    }
  </style>
</head>
<body>

<div class="container">

  <h1>Qual é o seu Arquétipo?</h1>

  <p class="sub">
    Descubra qual energia feminina guia sua essência, seus desejos e sua forma de existir no mundo.
  </p>

  <div id="quiz"></div>

    Descobrir meu arquétipo ✨

  <div id="resultado"></div>

  {

    opcoes: [

      ["Amor acolhedor", "rainha de ouros"],

  },
  {
    pergunta: "Você se considera mais:",
    opcoes: [
      ["Elegante", "diamante"],
      ["Sensual", "afrodite"],
      ["Dominante", "pantera negra"],

    ]
  },
  {
    pergunta: "Sua maior arma é:",
    opcoes: [
      ["Inteligência emocional", "raposa"],
      ["Presença magnética", "sereia"],
      ["Autoconfiança", "imperatriz"],
      ["Desejo", "sucubo"]
    ]
  },
  {
    pergunta: "Qual dessas vidas parece mais atraente?",
    opcoes: [
      ["Rainha de um reino luxuoso", "cleopatra"],
      ["Maga misteriosa", "bruxa"],
      ["Empresária poderosa", "diamante"],
      ["Mulher livre e selvagem", "pantera negra"]
    ]
  },
  {
    pergunta: "No fundo, você quer ser lembrada como:",
    opcoes: [
      ["A inesquecível", "sereia"],
      ["A poderosa", "imperatriz"],
      ["A revolucionária", "lilith"],
      ["A divina", "afrodite"]
    ]
  }
];

const descricoes = {
  "afrodite": "Você carrega magnetismo, sensualidade e presença luminosa. Sua energia encanta naturalmente.",
  "bruxa": "Você é intuitiva, profunda e conectada ao invisível. Existe magia na sua presença.",
  "cleopatra": "Você nasceu para liderança, estratégia e impacto. Sua energia é imperial.",
  "coruja": "Você observa antes de agir. Inteligência e mistério são sua assinatura.",
  "diamante": "Elegante, rara e refinada. Você transmite valor sem precisar provar nada.",
  "imperatriz": "Você lidera com presença, acolhimento e força feminina.",
  "jessica rabbit": "Provocante, divertida e inesquecível. Seu charme domina qualquer ambiente.",
  "lilith": "Livre, intensa e indomável. Você não nasceu para ser controlada.",
  "pantera negra": "Seu poder é instintivo, forte e silenciosamente perigoso.",
  "rainha de ouros": "Você representa estabilidade, cuidado e abundância emocional.",
  "raposa": "Estratégica e inteligente. Você sabe se adaptar e conquistar.",
  "sereia": "Hipnótica e emocional. Sua energia atrai sem esforço.",
  "sucubo": "Desejo, intensidade e magnetismo sombrio fazem parte da sua essência."
};

const pontuacao = {};

Object.keys(descricoes).forEach(a => pontuacao[a] = 0);

const quiz = document.getElementById('quiz');

perguntas.forEach((q, index) => {

  const div = document.createElement('div');
  div.className = 'question';

  div.innerHTML = `
    <h2>${index + 1}. ${q.pergunta}</h2>
    <div class="options">
      ${q.opcoes.map((opcao, i) => `
        <div class="option" onclick="selecionar(this, '${opcao[1]}', ${index})">
          ${opcao[0]}
        </div>
      `).join('')}
    </div>
  `;

  quiz.appendChild(div);
});

const respostas = {};

function selecionar(elemento, arquétipo, perguntaIndex) {

  const opcoes = elemento.parentElement.querySelectorAll('.option');

  opcoes.forEach(op => op.classList.remove('selected'));

  elemento.classList.add('selected');

  respostas[perguntaIndex] = arquétipo;
}

function mostrarResultado() {

  Object.keys(pontuacao).forEach(a => pontuacao[a] = 0);

  Object.values(respostas).forEach(r => {
    pontuacao[r]++;
  });

  const respondidas = Object.keys(respostas).length;

  if(respondidas < perguntas.length){
    alert('Responda todas as perguntas ✨');
    return;
  }

  const vencedor = Object.keys(pontuacao).reduce((a,b)=>
    pontuacao[a] > pontuacao[b] ? a : b
  );

  const resultado = document.getElementById('resultado');

  resultado.style.display = 'block';

  resultado.innerHTML = `
    <h2>${vencedor.toUpperCase()}</h2>

    <p>
      ${descricoes[vencedor]}
    </p>

    <div class="botoes">

  <a class="spotify"
     href="https://somvibe.lnk.to/ab36404"
     target="_blank">

     Ouvir álbum completo 🎵

  </a>

  <a class="spotify"
     href="https://universalismanifesto.my.canva.site/arquetipos"
     target="_blank">

     ↩ Voltar ao site

  </a>

</div>
  `;

  resultado.scrollIntoView({ behavior: 'smooth' });
}

</script>

</html>
